        AND start_ts > (UNIX_TIMESTAMP() - 31536000);
    column: "max_gust"
    unit_of_measurement: "mph"
    state_class: measurement
    db_url: !secret mariadb_url

  # --------------------------------------------------------------------------
  # Temperature Statistics (Using sensor.tempest_temperature)
  # --------------------------------------------------------------------------
  - name: "Tempest Max Temperature 7 Days"
    unique_id: tempest_max_temperature_7_days
    query: >
      SELECT ROUND(MAX(max), 1) as max_temp
      FROM statistics
      INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
      WHERE statistics_meta.statistic_id = 'sensor.tempest_temperature'
        AND start_ts > (UNIX_TIMESTAMP() - 604800);
    column: "max_temp"
    unit_of_measurement: "°F"
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Tempest Max Temperature 30 Days"
    unique_id: tempest_max_temperature_30_days
    query: >
      SELECT ROUND(MAX(max), 1) as max_temp
      FROM statistics
      INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
      WHERE statistics_meta.statistic_id = 'sensor.tempest_temperature'
        AND start_ts > (UNIX_TIMESTAMP() - 2592000);
    column: "max_temp"
    unit_of_measurement: "°F"
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Tempest Max Temperature 365 Days"
    unique_id: tempest_max_temperature_365_days
    query: >
      SELECT ROUND(MAX(max), 1) as max_temp
      FROM statistics
      INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
      WHERE statistics_meta.statistic_id = 'sensor.tempest_temperature'
