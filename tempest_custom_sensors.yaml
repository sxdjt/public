# Tempest Weather Station - Custom Sensors
#
# Requires both the Weatherflow (local) and Weatherflow Cloud integrations.
#
# Sensors Index:
#   Precipitation Duration Today Hours
#   Precipitation Duration Total 30 Days
#   Precipitation Duration Total 365 Days
#   Precipitation Duration Total 7 Days
#   Precipitation Duration Yesterday Hours
#   Rainfall Last 30 Days
#   Rainfall Last 365 Days
#   Rainfall Last 7 Days
#   Tempest Dew Point Spread
#   Tempest Max Temperature 30 Days
#   Tempest Max Temperature 365 Days
#   Tempest Max Temperature 7 Days
#   Tempest Min Temperature 30 Days
#   Tempest Min Temperature 365 Days
#   Tempest Min Temperature 7 Days
#   Tempest Precipitation Intensity Rounded
#   Tempest Rain Intensity
#   Tempest Sea Level Pressure
#   Tempest Temperature 24h Rolling Average
#   Tempest Weatherflow Precipitation Today Imperial
#   Tempest Weatherflow Precipitation Yesterday Imperial
#   Tempest Weatherflow Rain Last Hour Imperial
#   WBGT Heat Risk Level
#   Wind Gust Max 1 Hour
#   Wind Gust Max 12 Hours
#   Wind Gust Max 24 Hours
#   Wind Gust Max 30 Days
#   Wind Gust Max 365 Days
#   Wind Gust Max 4 Hours
#   Wind Gust Max 7 Days

# ============================================================================
# TEMPLATE SENSORS
# ============================================================================
template:

  # --------------------------------------------------------------------------
  # Rain Rates
  # --------------------------------------------------------------------------
  - sensor:
      - name: "Tempest Rain Intensity"
        unique_id: tempest_rain_intensity
        icon: mdi:weather-pouring
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ is_number(states('sensor.tempest_precipitation_intensity')) }}
        state: >
          {% set rate = states('sensor.tempest_precipitation_intensity') | float(0) %}
          {% if rate == 0 %}
            None
          {% elif rate < 0.01 %}
            Very Light
          {% elif rate < 0.04 %}
            Light
          {% elif rate < 0.16 %}
            Moderate
          {% elif rate < 0.63 %}
            Heavy
          {% elif rate < 1.97 %}
            Very Heavy
          {% else %}
            Extreme
          {% endif %}

      - name: "Tempest Precipitation Intensity Rounded"
        unique_id: tempest_precipitation_intensity_rounded
        icon: mdi:weather-rainy
        unit_of_measurement: "in/hr"
        state_class: measurement
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ is_number(states('sensor.tempest_precipitation_intensity')) }}
        state: >
          {{ states('sensor.tempest_precipitation_intensity') | float(0) | round(2) }}

  # --------------------------------------------------------------------------
  # Dew Point Spread (Fog/Condensation Risk Indicator)
  # --------------------------------------------------------------------------
  - sensor:
      - name: "Tempest Dew Point Spread"
        unique_id: tempest_dew_point_spread
        unit_of_measurement: "°F"
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.tempest_temperature'))
             and is_number(states('sensor.tempest_dew_point')) }}
        state: >
          {% set temp = states('sensor.tempest_temperature') | float(0) %}
          {% set dewpt = states('sensor.tempest_dew_point') | float(0) %}
          {{ (temp - dewpt) | round(1) }}
        attributes:
          attribution: "Custom sensor"
          fog_risk: >
            {# Recalculate spread here to avoid circular dependency with the sensor's own state #}
            {% set temp = states('sensor.tempest_temperature') | float(0) %}
            {% set dewpt = states('sensor.tempest_dew_point') | float(0) %}
            {% set spread = temp - dewpt %}
            {% if spread < 3 %} High - Fog/frost very likely
            {% elif spread < 5 %} Moderate - Fog/frost possible
            {% else %} Low
            {% endif %}

  # --------------------------------------------------------------------------
  # Heat Risk Index
  # --------------------------------------------------------------------------
  - sensor:
      - name: "WBGT Heat Risk Level"
        unique_id: wbgt_heat_risk_level
        icon: mdi:thermometer-alert
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ is_number(states('sensor.tempest_weatherflow_wet_bulb_globe_temperature')) }}
        state: >
          {% set wbgt = states('sensor.tempest_weatherflow_wet_bulb_globe_temperature') | float(0) %}
          {% if wbgt < 80 %}
            Low
          {% elif wbgt < 85 %}
            Moderate
          {% elif wbgt < 88 %}
            High
          {% elif wbgt < 90 %}
            Very High
          {% else %}
            Extreme
          {% endif %}

  # --------------------------------------------------------------------------
  # Pressure Calculations
  # --------------------------------------------------------------------------
  - sensor:
      - name: "Tempest Sea Level Pressure"
        unique_id: tempest_sea_level_pressure
        unit_of_measurement: "inHg"
        device_class: atmospheric_pressure
        state_class: measurement
        icon: mdi:gauge
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ states('sensor.tempest_air_pressure') | float(none) is not none }}
        state: >
          {# Get station pressure and convert inHg to mb #}
          {% set p_sta_inhg = states('sensor.tempest_air_pressure') | float(0) %}
          {% set p_sta = p_sta_inhg * 33.8639 %}

          {# Elevation and sensor height #}
          {% set h_el = 682 * 0.3048 %}   {# ground elevation in meters #}
          {% set h_ag = 2.0 %}            {# sensor height above ground in meters #}

          {# Constants #}
          {% set P_0 = 1013.25 %}         {# standard sea level pressure, mb #}
          {% set R_d = 287.05 %}          {# gas constant for dry air, J/(kg-K) #}
          {% set gamma_s = 0.0065 %}      {# standard lapse rate, K/m #}
          {% set g = 9.80665 %}           {# gravity, m/s2 #}
          {% set T_0 = 288.15 %}          {# standard sea level temp, K #}

          {# Calculate exponent: g / (R_d x gamma_s) #}
          {% set exp = g / (R_d * gamma_s) %}

          {# Tempest formula #}
          {% set inner_exp = (R_d * gamma_s) / g %}
          {% set bracket = 1 + ((P_0 / p_sta) ** inner_exp) * (gamma_s * (h_el + h_ag)) / T_0 %}
          {% set p_sl_mb = p_sta * (bracket ** exp) %}

          {# Convert back to inHg #}
          {% set p_sl_inhg = p_sl_mb / 33.8639 %}

          {{ p_sl_inhg }}

  # --------------------------------------------------------------------------
  # Precipitation (Metric to Imperial Conversion)
  # --------------------------------------------------------------------------
  - sensor:
      - name: "Tempest Weatherflow Rain Last Hour Imperial"
        unique_id: tempest_weatherflow_rain_last_hour_imperial
        unit_of_measurement: "in"
        device_class: precipitation
        state_class: measurement
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ is_number(states('sensor.tempest_weatherflow_rain_last_hour')) }}
        state: >
          {% set mm = states('sensor.tempest_weatherflow_rain_last_hour') | float(0) %}
          {{ (mm / 25.4) | round(2) }}

      - name: "Tempest Weatherflow Precipitation Today Imperial"
        unique_id: tempest_weatherflow_precipitation_today_imperial
        unit_of_measurement: "in"
        device_class: precipitation
        state_class: total
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ is_number(states('sensor.tempest_weatherflow_precipitation_today')) }}
        state: >
          {% set mm = states('sensor.tempest_weatherflow_precipitation_today') | float(0) %}
          {{ (mm / 25.4) | round(2) }}

      - name: "Tempest Weatherflow Precipitation Yesterday Imperial"
        unique_id: tempest_weatherflow_precipitation_yesterday_imperial
        unit_of_measurement: "in"
        device_class: precipitation
        state_class: total
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ is_number(states('sensor.tempest_weatherflow_precipitation_yesterday')) }}
        state: >
          {% set mm = states('sensor.tempest_weatherflow_precipitation_yesterday') | float(0) %}
          {{ (mm / 25.4) | round(2) }}

      # Convert API-supplied minutes to hours for display
      - name: "Precipitation Duration Today Hours"
        unique_id: tempest_weatherflow_precipitation_duration_today_hours
        icon: mdi:timer-outline
        unit_of_measurement: "h"
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ is_number(states('sensor.tempest_weatherflow_precipitation_duration_today')) }}
        state: >
          {{ (states('sensor.tempest_weatherflow_precipitation_duration_today') | float(0) / 60) | round(1) }}

      # Convert API-supplied minutes to hours for display
      - name: "Precipitation Duration Yesterday Hours"
        unique_id: tempest_weatherflow_precipitation_duration_yesterday_hours
        icon: mdi:timer-outline
        unit_of_measurement: "h"
        attributes:
          attribution: "Custom sensor"
        availability: >
          {{ is_number(states('sensor.tempest_weatherflow_precipitation_duration_yesterday')) }}
        state: >
          {{ (states('sensor.tempest_weatherflow_precipitation_duration_yesterday') | float(0) / 60) | round(1) }}

# ============================================================================
# STATISTICS SENSORS
# ============================================================================
sensor:

  - platform: statistics
    name: "Wind Gust Max 1 Hour"
    unique_id: wind_gust_max_1hour
    entity_id: sensor.tempest_wind_gust
    state_characteristic: value_max
    max_age:
      hours: 1
    sampling_size: 5000

  - platform: statistics
    name: "Tempest Temperature 24h Rolling Average"
    unique_id: tempest_temperature_24h_rolling_average
    entity_id: sensor.tempest_temperature
    state_characteristic: mean
    sampling_size: 1440
    max_age:
      hours: 24

# ============================================================================
# SQL SENSORS
# ============================================================================
sql:

  # --------------------------------------------------------------------------
  # Rainfall (Using sensor.tempest_weatherflow_precipitation_today_imperial)
  # --------------------------------------------------------------------------
  - name: "Rainfall Last 7 Days"
    unique_id: tempest_rainfall_last_7_days
    query: >
      SELECT ROUND(SUM(daily_max), 2) as total
      FROM (
        SELECT MAX(state) as daily_max
        FROM statistics
        INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
        WHERE statistics_meta.statistic_id = 'sensor.tempest_weatherflow_precipitation_today_imperial'
          AND start_ts > (UNIX_TIMESTAMP() - 604800)
        GROUP BY DATE(FROM_UNIXTIME(start_ts))
      ) as daily;
    column: "total"
    unit_of_measurement: "in"
    device_class: precipitation
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Rainfall Last 30 Days"
    unique_id: tempest_rainfall_last_30_days
    query: >
      SELECT ROUND(SUM(daily_max), 2) as total
      FROM (
        SELECT MAX(state) as daily_max
        FROM statistics
        INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
        WHERE statistics_meta.statistic_id = 'sensor.tempest_weatherflow_precipitation_today_imperial'
          AND start_ts > (UNIX_TIMESTAMP() - 2592000)
        GROUP BY DATE(FROM_UNIXTIME(start_ts))
      ) as daily;
    column: "total"
    unit_of_measurement: "in"
    device_class: precipitation
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Rainfall Last 365 Days"
    unique_id: tempest_rainfall_last_365_days
    query: >
      SELECT ROUND(SUM(daily_max), 2) as total
      FROM (
        SELECT MAX(state) as daily_max
        FROM statistics
        INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
        WHERE statistics_meta.statistic_id = 'sensor.tempest_weatherflow_precipitation_today_imperial'
          AND start_ts > (UNIX_TIMESTAMP() - 31536000)
        GROUP BY DATE(FROM_UNIXTIME(start_ts))
      ) as daily;
    column: "total"
    unit_of_measurement: "in"
    device_class: precipitation
    state_class: measurement
    db_url: !secret mariadb_url

  # --------------------------------------------------------------------------
  # Precipitation Duration (Using sensor.tempest_weatherflow_precipitation_duration_today)
  # --------------------------------------------------------------------------
  - name: "Precipitation Duration Total 7 Days"
    unique_id: tempest_weatherflow_precipitation_duration_total_7_days
    query: >
      SELECT ROUND(SUM(daily_max) / 60, 1) as total_hours
      FROM (
        SELECT MAX(max) as daily_max
        FROM statistics
        INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
        WHERE statistics_meta.statistic_id = 'sensor.tempest_weatherflow_precipitation_duration_today'
          AND start_ts > (UNIX_TIMESTAMP() - 604800)
        GROUP BY DATE(FROM_UNIXTIME(start_ts))
      ) as daily;
    column: "total_hours"
    unit_of_measurement: "h"
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Precipitation Duration Total 30 Days"
    unique_id: tempest_weatherflow_precipitation_duration_total_30_days
    query: >
      SELECT ROUND(SUM(daily_max) / 60, 1) as total_hours
      FROM (
        SELECT MAX(max) as daily_max
        FROM statistics
        INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
        WHERE statistics_meta.statistic_id = 'sensor.tempest_weatherflow_precipitation_duration_today'
          AND start_ts > (UNIX_TIMESTAMP() - 2592000)
        GROUP BY DATE(FROM_UNIXTIME(start_ts))
      ) as daily;
    column: "total_hours"
    unit_of_measurement: "h"
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Precipitation Duration Total 365 Days"
    unique_id: tempest_weatherflow_precipitation_duration_total_365_days
    query: >
      SELECT ROUND(SUM(daily_max) / 60, 1) as total_hours
      FROM (
        SELECT MAX(max) as daily_max
        FROM statistics
        INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
        WHERE statistics_meta.statistic_id = 'sensor.tempest_weatherflow_precipitation_duration_today'
          AND start_ts > (UNIX_TIMESTAMP() - 31536000)
        GROUP BY DATE(FROM_UNIXTIME(start_ts))
      ) as daily;
    column: "total_hours"
    unit_of_measurement: "h"
    state_class: measurement
    db_url: !secret mariadb_url

  # --------------------------------------------------------------------------
  # Wind Gust Statistics (Using sensor.tempest_wind_gust)
  # --------------------------------------------------------------------------
  - name: "Wind Gust Max 4 Hours"
    unique_id: wind_gust_max_4h
    query: >
      SELECT ROUND(MAX(max), 1) as max_gust
      FROM statistics
      INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
      WHERE statistics_meta.statistic_id = 'sensor.tempest_wind_gust'
        AND start_ts > (UNIX_TIMESTAMP() - 14400);
    column: "max_gust"
    unit_of_measurement: "mph"
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Wind Gust Max 12 Hours"
    unique_id: wind_gust_max_12h
    query: >
      SELECT ROUND(MAX(max), 1) as max_gust
      FROM statistics
      INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
      WHERE statistics_meta.statistic_id = 'sensor.tempest_wind_gust'
        AND start_ts > (UNIX_TIMESTAMP() - 43200);
    column: "max_gust"
    unit_of_measurement: "mph"
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Wind Gust Max 24 Hours"
    unique_id: wind_gust_max_24h
    query: >
      SELECT ROUND(MAX(max), 1) as max_gust
      FROM statistics
      INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
      WHERE statistics_meta.statistic_id = 'sensor.tempest_wind_gust'
        AND start_ts > (UNIX_TIMESTAMP() - 86400);
    column: "max_gust"
    unit_of_measurement: "mph"
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Wind Gust Max 7 Days"
    unique_id: wind_gust_max_1w
    query: >
      SELECT ROUND(MAX(max), 1) as max_gust
      FROM statistics
      INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
      WHERE statistics_meta.statistic_id = 'sensor.tempest_wind_gust'
        AND start_ts > (UNIX_TIMESTAMP() - 604800);
    column: "max_gust"
    unit_of_measurement: "mph"
    state_class: measurement
    db_url: !secret mariadb_url

  - name: "Wind Gust Max 30 Days"
    unique_id: wind_gust_max_1month
    query: >
      SELECT ROUND(MAX(max), 1) as max_gust
      FROM statistics
      INNER JOIN statistics_meta ON statistics.metadata_id = statistics_meta.id
      WHERE statistics_meta.statistic_id = 'sensor.tempest_wind_gust'
        AND start_ts > (UNIX_TIMESTAMP() - 2592000);
